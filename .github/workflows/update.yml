name: Update data

on:
  schedule:
    - cron: "15 21 * * *"   # 00:15 МСК: торги прошедшего дня уже в истории ISS
  workflow_dispatch:

permissions:
  contents: write

concurrency: update-data

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pulse.build
      - name: Commit new data
        run: |
          git config user.name "Anton Shkel"
          git config user.email "236247991+antonshkelll@users.noreply.github.com"
          git add data charts docs/data.json README.md
          if git diff --cached --quiet; then echo "Нового нет"; exit 0; fi
          git commit -m "data: обновление $(date -u +%F)"
          git push
